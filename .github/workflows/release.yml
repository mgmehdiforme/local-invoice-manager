name: Release

# Push a tag like v1.0.0 to build the downloads and the Docker image and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  native:
    name: Build ${{ matrix.rid }}
    strategy:
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: win-x64, os: ubuntu-latest }
          # macOS builds run on macOS so the executable gets the ad-hoc signature Apple Silicon requires.
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Publish
        env:
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" OUT=dist bash scripts/publish-native.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: [native, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release create "${{ github.ref_name }}" dist/* --title "Invoice Manager ${{ github.ref_name }}" --generate-notes
